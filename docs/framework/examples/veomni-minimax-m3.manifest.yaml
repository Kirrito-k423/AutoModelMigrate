      reason: Tokenizer class, special tokens, chat template, and media placeholder tokens are unknown.
      owner_layer: DataAdapter
      evidence:
        - id: m3-assumptions-tokenizer
          kind: project-doc
          uri: docs/cases/veomni-minimax-m3/assumptions.md
      next_action: Inspect Hugging Face tokenizer and processor files.

